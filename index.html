<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Cinecode Studio</title>
<style>
:root {
  --bg: #050505;
  --glass: rgba(255,255,255,.045); --glass-2: rgba(255,255,255,.075); --glass-3: rgba(255,255,255,.12);
  --stroke: rgba(255,255,255,.085); --stroke-2: rgba(255,255,255,.16);
  --hi: inset 0 1px 0 rgba(255,255,255,.07);
  --label: #f5f5f5; --label-2: rgba(235,235,235,.6); --label-3: rgba(235,235,235,.34);
  --neon: #3dff7a; --neon-ink: #04140a; --blue: #3dff7a; --violet: #3dff7a; --teal: #3dff7a;
  --grad: #3dff7a;
  --blue-soft: rgba(61,255,122,.1);
  --green: #3dff7a; --orange: #ffb35c; --red: #ff6b6b;
  --field: rgba(255,255,255,.06); --hover: rgba(255,255,255,.05); --sep: rgba(255,255,255,.07);
  --group: var(--glass); --card-shadow: 0 0 0 1px var(--stroke), var(--hi);
  --blur: blur(28px) saturate(160%);
  --r: 18px; --pad: 40px;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--label); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; letter-spacing: -.005em; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; }
::selection { background: rgba(61,255,122,.35); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; } ::-webkit-scrollbar-track { background: transparent; }

/* ambient light: three slow blobs behind the glass */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.aurora i { position: absolute; border-radius: 50%; animation: drift 38s ease-in-out infinite alternate; will-change: transform; }
.aurora i:nth-child(1) { width: 90vw; height: 90vw; left: -30vw; top: -50vw; background: radial-gradient(closest-side, rgba(255,255,255,.075), transparent); }
.aurora i:nth-child(2) { width: 60vw; height: 60vw; right: -24vw; top: 10vh; background: radial-gradient(closest-side, rgba(255,255,255,.04), transparent); animation-duration: 46s; }
.aurora i:nth-child(3) { width: 70vw; height: 70vw; left: 20vw; bottom: -50vw; background: radial-gradient(closest-side, rgba(61,255,122,.0), transparent); transition: background 1s; animation-duration: 52s; }
body.busy .aurora i:nth-child(3) { background: radial-gradient(closest-side, rgba(61,255,122,.09), transparent); }
.aurora::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 120%, transparent, rgba(6,7,11,.55) 70%); }
body.busy .aurora i { animation-duration: 14s; }
@keyframes drift { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vw,4vh) scale(1.12); } 100% { transform: translate(-4vw,8vh) scale(.94); } }

.app { position: relative; z-index: 1; display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100vh; padding: 12px 0 12px 12px; gap: 0; }

/* sidebar: floating glass rail */
.side { background: rgba(18,18,18,.5); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--stroke); box-shadow: var(--hi), 0 30px 60px rgba(0,0,0,.35); border-radius: 22px; display: flex; flex-direction: column; min-height: 0; padding: 40px 10px 10px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.brand i { width: 26px; height: 26px; border-radius: 8px; background: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
.brand i::after { content: ""; width: 0; height: 0; border-left: 8px solid #000; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.row-btn { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 11px; text-align: left; white-space: nowrap; overflow: hidden; color: var(--label-2); font-weight: 500; transition: background .15s, color .15s; }
.row-btn:hover { background: var(--hover); color: var(--label); }
.row-btn.on { background: var(--glass-3); color: var(--label); }
.row-btn.on svg { color: var(--blue); }
.row-btn .count { margin-left: auto; color: var(--label-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.side h3 { font-size: 12px; font-weight: 600; color: var(--label-3); padding: 22px 10px 8px; }
.films { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.film { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 10px; align-items: center; padding: 7px 8px; border-radius: 12px; text-align: left; }
.film:hover { background: var(--hover); }
.film.on { background: var(--glass-2); }
.thumb { width: 44px; height: 30px; border-radius: 7px; background: rgba(0,0,0,.5); overflow: hidden; display: grid; place-items: center; grid-row: span 2; color: var(--label-3); box-shadow: 0 0 0 1px var(--stroke); }
.thumb video, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.film b { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.film small { color: var(--label-2); font-size: 11.5px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--label-3); flex: none; }
.dot.running { background: var(--blue); box-shadow: 0 0 10px var(--blue); animation: pulse 1.6s ease-in-out infinite; }
.dot.waiting { background: var(--green); } .dot.error { background: var(--red); } .dot.stopped { background: var(--orange); }
@keyframes pulse { 50% { opacity: .35; } }
.empty-side { color: var(--label-3); font-size: 12.5px; padding: 4px 10px; }

/* main */
.main { display: grid; grid-template-rows: 40px minmax(0, 1fr) auto; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 0 28px; -webkit-app-region: drag; }
.toolbar h1 { font-size: 15px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolbar .acts { display: flex; gap: 8px; align-items: center; -webkit-app-region: no-drag; }
.body { overflow: auto; min-height: 0; scrollbar-gutter: stable both-edges; }
.page { max-width: 880px; margin: 0 auto; padding: 8px var(--pad) 48px; }
.page.wide { max-width: 1180px; }
.head-row { display: flex; align-items: center; gap: 12px; margin: 6px 0 22px; }
.large { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; flex: 1; margin-bottom: 20px; }
.head-row .large { margin-bottom: 0; }
.sub { color: var(--label-2); margin: -8px 0 22px; font-size: 15px; }
.foot { padding: 12px 12px 0; }
.foot-in { display: flex; align-items: center; gap: 10px; max-width: 800px; margin: 0 auto; padding: 12px 14px 12px 20px; min-height: 64px; background: rgba(18,18,18,.6); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--stroke); border-radius: 20px; box-shadow: var(--hi), 0 20px 50px rgba(0,0,0,.4); }
.foot-in.full { max-width: none; margin: 0 12px 0 0; }
.foot:empty { display: none; }
.foot-in .meta { flex: 1; color: var(--label-2); font-size: 13px; min-width: 0; }
.foot-in .meta b { color: var(--label); font-weight: 600; }
.example-bar { display: flex; align-items: center; gap: 14px; width: 100%; }
.example-bar > span { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--neon); color: var(--neon-ink); flex: none; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
.example-bar p { flex: 1; margin: 0; color: var(--label-2); font-size: 13.5px; line-height: 1.45; min-width: 0; }

.btn { height: 34px; padding: 0 16px; border-radius: 11px; font-weight: 550; background: var(--glass-2); border: 1px solid var(--stroke); box-shadow: var(--hi); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: background .15s, transform .1s; }
.btn:hover { background: var(--glass-3); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--neon); border-color: transparent; color: var(--neon-ink); box-shadow: 0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.plain { background: transparent; border: 0; box-shadow: none; color: var(--blue); padding: 0; height: auto; }
.btn.danger { color: var(--red); background: transparent; border-color: transparent; box-shadow: none; padding: 0 8px; }
.btn.lg { height: 42px; padding: 0 22px; border-radius: 13px; font-size: 14.5px; }
.btn.sm { height: 28px; padding: 0 11px; border-radius: 9px; font-size: 12.5px; }
.btn:disabled { opacity: .4; transform: none; }

/* grouped glass lists */
.section-title { font-size: 13px; font-weight: 600; color: var(--label-2); margin: 28px 0 10px 4px; }
.sec-h { display: flex; align-items: baseline; gap: 12px; margin: 38px 4px 14px; }
.sec-h h3 { font-size: 19px; font-weight: 650; letter-spacing: -.015em; }
.sec-h small { color: var(--label-2); font-size: 13px; }
.sec-h.sub2 { margin-top: 18px; margin-bottom: 10px; }
.group { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-radius: var(--r); border: 1px solid var(--stroke); box-shadow: var(--hi); overflow: hidden; }
.group.mt { margin-top: 12px; }
.item { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 9px 18px; position: relative; width: 100%; text-align: left; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; border-top: 1px solid var(--sep); }
.item > .lbl { flex: 1; min-width: 0; }
.item > .lbl small { display: block; color: var(--label-2); font-size: 12.5px; margin-top: 1px; }
.item .ctl { flex: none; display: flex; align-items: center; gap: 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; align-items: start; }
.footnote { font-size: 12.5px; color: var(--label-2); margin: 10px 4px 0; }

/* controls */
.seg { display: inline-flex; background: rgba(0,0,0,.25); border: 1px solid var(--stroke); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { height: 28px; min-width: 48px; padding: 0 12px; border-radius: 8px; font-size: 13px; color: var(--label-2); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s, color .15s; }
.seg button:hover { color: var(--label); }
.seg button.on { background: var(--glass-3); color: var(--label); box-shadow: var(--hi), 0 2px 8px rgba(0,0,0,.25); font-weight: 550; }
.seg button:disabled { opacity: .4; }
.ratio { display: inline-block; border: 1.5px solid currentColor; border-radius: 2px; opacity: .7; }
.pop { position: relative; display: inline-block; }
.pop select { height: 34px; border: 1px solid var(--stroke); border-radius: 10px; background: rgba(0,0,0,.25); padding: 0 30px 0 12px; appearance: none; font-size: 13px; width: 200px; }
.pop select option { background: #1a1a1a; }
.pop::after { content: ""; position: absolute; right: 12px; top: 12px; width: 6px; height: 6px; border-right: 1.5px solid var(--label-2); border-bottom: 1.5px solid var(--label-2); transform: rotate(45deg); pointer-events: none; }
.num { width: 64px; height: 32px; border: 1px solid var(--stroke); border-radius: 9px; background: rgba(0,0,0,.25); text-align: center; font-variant-numeric: tabular-nums; }
.switch { width: 44px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.14); position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .2s; }
.switch.on { background: var(--neon); }
.switch.on::after { background: var(--neon-ink); }
.switch.on::after { transform: translateX(18px); }
.field { width: 100%; height: 34px; border: 1px solid var(--stroke); border-radius: 10px; background: rgba(0,0,0,.25); padding: 0 12px; outline: 0; }
.field:focus { border-color: rgba(255,255,255,.6); }
.field.bare { background: transparent; border: 0; padding: 0; height: 32px; }
.field::placeholder, textarea::placeholder, input::placeholder { color: var(--label-3); }

/* flow steps */
.flow { list-style: none; padding: 0; display: flex; gap: 6px; margin: 4px 0 26px; }
.flow li { display: flex; align-items: center; gap: 6px; color: var(--label-3); font-size: 13px; font-weight: 550; }
.flow li + li::before { content: ""; width: 22px; height: 1px; background: var(--stroke-2); margin-right: 2px; }
.flow button { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 4px; border-radius: 15px; color: inherit; }
.flow button:not(:disabled):hover { background: var(--hover); color: var(--label); }
.flow span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; border: 1px solid var(--stroke-2); font-variant-numeric: tabular-nums; }
.flow span svg { width: 12px; height: 12px; stroke-width: 3; }
.flow li.done { color: var(--label-2); } .flow li.done span { background: rgba(61,255,122,.16); border-color: transparent; color: var(--green); }
.flow li.now { color: var(--label); } .flow li.now span { background: var(--neon); border-color: transparent; color: var(--neon-ink); box-shadow: 0 4px 14px rgba(0,0,0,.45); }

/* composer: the hero */
.composer { position: relative; background: rgba(20,20,20,.6); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-radius: 24px; border: 1px solid var(--stroke-2); box-shadow: var(--hi), 0 30px 80px rgba(0,0,0,.45); padding: 8px 22px 16px; }
.composer::before { content: ""; position: absolute; inset: -1px; border-radius: 25px; padding: 1px; background: conic-gradient(from var(--ang, 0deg), transparent 0 60%, rgba(255,255,255,.9) 75%, rgba(255,255,255,.9) 85%, transparent 95%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity .4s; pointer-events: none; animation: spinb 5s linear infinite; }
.composer:focus-within::before { opacity: 1; }
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes spinb { to { --ang: 360deg; } }
.comp-tabs { display: flex; gap: 4px; padding: 6px 0 4px; margin: 0 -10px; }
.comp-tabs button { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 10px; color: var(--label-2); font-weight: 550; font-size: 13px; }
.comp-tabs button:hover { color: var(--label); background: var(--hover); }
.comp-tabs button.on { color: var(--label); background: var(--glass-2); box-shadow: var(--hi); }
.comp-tabs button.on svg { color: var(--blue); }
.composer textarea { width: 100%; min-height: 132px; border: 0; outline: 0; background: transparent; resize: none; font-size: 20px; line-height: 1.5; letter-spacing: -.01em; display: block; padding-top: 8px; }
.composer .idea-line { width: 100%; height: 44px; border: 0; outline: 0; background: transparent; font-size: 17px; font-weight: 550; border-bottom: 1px solid var(--sep); }
.composer textarea.script-ta { min-height: 200px; font-size: 16px; line-height: 1.65; resize: vertical; }
.script-bar { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--label-2); padding: 6px 0 2px; }
.dur-hint { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; padding: 10px 12px 10px 14px; border-radius: 12px; background: rgba(255,179,92,.08); border: 1px solid rgba(255,179,92,.25); color: #ffd6a8; font-size: 13px; }
.dur-hint[hidden] { display: none; }
.dur-hint span { flex: 1; }
.dur-hint svg { width: 16px; height: 16px; flex: none; }
.attach { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; border-top: 1px solid var(--sep); margin-top: 8px; }
.chip { height: 32px; padding: 0 13px; border-radius: 16px; background: var(--glass-2); border: 1px solid var(--stroke); display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--label-2); max-width: 100%; transition: background .15s, color .15s; }
.chip:hover { color: var(--label); background: var(--glass-3); }
.chip.set, .chip.on { background: var(--blue-soft); border-color: rgba(255,255,255,.35); color: #fff; }
.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.chip .x { opacity: .7; margin-right: -6px; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; }
.chip .x:hover { opacity: 1; background: rgba(255,255,255,.12); }
.warn-line { color: var(--orange); }

/* choice tiles */
.tiles { display: grid; gap: 12px; }
.tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { position: relative; text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 16px; min-height: 112px; border-radius: 18px; background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--stroke); box-shadow: var(--hi); transition: background .2s, border-color .2s, box-shadow .2s, transform .15s; }
.tiles.two .tile { min-height: 88px; }
.tile:hover { background: var(--glass-2); transform: translateY(-1px); }
.tile b { font-size: 15px; font-weight: 600; margin-top: auto; }
.tile small { color: var(--label-2); font-size: 12.5px; line-height: 1.35; }
.tile.on { background: rgba(255,255,255,.07); border-color: var(--neon); box-shadow: var(--hi), 0 0 0 1px rgba(255,255,255,.35), 0 12px 36px rgba(0,0,0,.45); }
.tile .frame { width: 40px; height: 40px; display: grid; place-items: center; margin-bottom: 10px; }
.tile .frame i { display: block; border: 1.6px solid var(--label-2); border-radius: 4px; }
.tile.on .frame i { border-color: transparent; background: var(--grad); box-shadow: 0 4px 14px rgba(0,0,0,.45); }
.tile-ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: rgba(255,255,255,.07); color: var(--label-2); margin-bottom: 10px; }
.tiles.two .tile-ic { margin-bottom: 6px; }
.tile.on .tile-ic { background: var(--neon); color: var(--neon-ink); box-shadow: 0 4px 14px rgba(0,0,0,.45); }
.tile-ok { position: absolute; top: 14px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }

/* length */
.len { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--stroke); box-shadow: var(--hi); border-radius: 18px; padding: 18px 20px 14px; }
.len-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.len output { font-size: 30px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; min-width: 120px; color: #fff; }
.len input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin-top: 10px; }
.len input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--neon) calc(11px + (100% - 22px) * var(--p, .4)), rgba(255,255,255,.14) calc(11px + (100% - 22px) * var(--p, .4))); }
.len input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; margin-top: -8px; box-shadow: 0 0 0 4px rgba(255,255,255,.35), 0 4px 12px rgba(0,0,0,.4); }
.len-scale { position: relative; height: 26px; font-size: 12px; font-variant-numeric: tabular-nums; }
.len-scale button { position: absolute; top: 2px; left: calc(11px + (100% - 22px) * var(--p)); transform: translateX(-50%); white-space: nowrap; height: 24px; padding: 0 8px; border-radius: 12px; color: var(--label-3); }
.len-scale button::before { content: ""; position: absolute; left: 50%; top: -9px; width: 1px; height: 6px; background: rgba(255,255,255,.22); }
.len-scale button:hover { color: var(--label); }
.len-scale button.on { color: var(--neon); }
.len-mode { margin-left: auto; color: var(--label-2); font-size: 13px; }
.tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; padding: 16px; border-radius: 18px; background: var(--glass); border: 1px solid var(--stroke); transition: border-color .15s, background .15s; }
.tray.drag { border-color: var(--neon); background: rgba(61,255,122,.05); }
.ti { position: relative; margin: 0; min-width: 0; }
.ti-media { position: relative; display: grid; place-items: center; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; background: rgba(0,0,0,.35); border: 1px solid var(--stroke); }
.ti-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ti figcaption { margin-top: 7px; font-size: 12px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ti-badge { position: absolute; left: 8px; bottom: 8px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.6); color: #fff; }
.ti-badge svg { width: 12px; height: 12px; }
.ti-x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.65); color: #fff; opacity: 0; transition: opacity .15s; }
.ti-x svg { width: 13px; height: 13px; }
.ti:hover .ti-x, .ti-x:focus-visible { opacity: 1; }
.ti.add { text-align: center; }

<script>
const $ = s => document.querySelector(s);

const icon = (n, cls = 'i') => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const api = (p, body) => fetch(p, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json', 'x-cs': '1' }, body: JSON.stringify(body) })
  .then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || r.statusText); return d; });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const LS = { get(k, f) { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const KEYS = [
  ['GEMINI_API_KEY', 'Gemini', 'Anlatım sesi (Gemini TTS). Ücretsiz anahtar: aistudio.google.com/apikey'],

];
const DURS = [[15, '15 sn'], [30, '30 sn'], [60, '1 dk'], [180, '3 dk'], [480, '8 dk']];
const defaults = { mode: 'quick', purpose: 'cinematic', seconds: 30, aspect: '16:9', res: 1080, fps: 30, lang: 'tr', voice: 'none', voiceGender: 'auto', voiceTone: '', voiceId: '', music: 'open', captions: false, sfx: true, lastVoice: 'gemini', deliver: 'final', scriptMode: 'ai', askFirst: true, cloneMode: 'same', appName: '', appWhat: '', appCta: '', saver: true, maxDrafts: 2, viewerRounds: 1 };
let S = { view: 'new', settings: { ...defaults, ...LS.get('cs.settings', {}) }, idea: LS.get('cs.idea', ''), script: LS.get('cs.script', ''), notes: '',
  refVideo: null, refFolder: null, refImages: [], appVideos: [], musicFile: null, q: null, answers: {}, own: {},
  job: null, events: [], out: { videos: [], stills: [], state: {} }, pick: null, dockMode: 'revise', ops: [], status: null, jobs: [], est: null };
let es = null, clock = null;
const saveDraft = () => { LS.set('cs.settings', S.settings); LS.set('cs.idea', S.idea); LS.set('cs.script', S.script); };
// Turkish narration runs about 2.2 words a second; English about 2.5.
const words = t => (t.trim().match(/\S+/g) || []).length;
const readSecs = t => Math.round(words(t) / (S.settings.lang === 'en' ? 2.5 : 2.2));
const STATUS = { running: 'Üretiliyor', waiting: 'Hazır', error: 'Hata', stopped: 'Durdu', queued: 'Sırada' };
function ago(t) { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return 'şimdi'; if (m < 60) return m + ' dk önce'; const h = Math.round(m / 60); if (h < 24) return h + ' sa önce'; return new Date(t).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }); }
const lenText = s => s >= 60 ? (s % 60 ? `${Math.floor(s / 60)} dk ${s % 60} sn` : `${s / 60} dk`) : s + ' sn';

// ---------- shell ----------
async function loadJobs() { S.jobs = await api('/api/jobs').catch(() => S.jobs); renderSide(); if (S.view === 'library') renderLibrary(); }
function renderSide() {

      <span class="thumb">${j.lastVideo || j.example ? `<img src="/poster/${j.id}?v=${esc(j.lastVideo || '')}" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment(icon('film')))">` : icon('film')}</span>

}
async function refreshStatus() { S.status = await api('/api/status').catch(() => S.status); if (S.view === 'new') renderNew(); if (S.view === 'settings') renderSettings(); }
function setChrome(title, { lined = false, acts = '' } = {}) { $('#title').textContent = title; $('#acts').innerHTML = acts; $('#toolbar').classList.toggle('lined', lined); }

// ---------- controls ----------
const RATIO = { '16:9': [16, 9], '9:16': [9, 16], '1:1': [12, 12], '4:5': [11, 14] };
function seg(key, opts, ratio) {
  return `<div class="seg" role="radiogroup">${opts.map(([v, l]) => {
    const on = String(S.settings[key]) === String(v), r = ratio && RATIO[v];
    return `<button role="radio" aria-checked="${on}" data-set="${key}" data-v="${v}" class="${on ? 'on' : ''}">${r ? `<i class="ratio" style="width:${Math.round(r[0] * .75)}px;height:${Math.round(r[1] * .75)}px"></i>` : ''}${l}</button>`;
  }).join('')}</div>`;
}
const pop = (key, opts) => `<span class="pop"><select data-sel="${key}" aria-label="${key}">${opts.map(([v, l]) => `<option value="${v}" ${String(S.settings[key]) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select></span>`;

const item = (label, ctl, sub) => `<div class="item"><div class="lbl">${label}${sub ? `<small>${sub}</small>` : ''}</div>${ctl ? `<div class="ctl">${ctl}</div>` : ''}</div>`;

async function updateEstimate() { S.est = await api(`/api/estimate?mode=${S.settings.mode}&seconds=${S.settings.seconds}`).catch(() => null); const m = $('#estMeta'); if (m) m.innerHTML = estText(); }

          ${j.status === 'running' ? `<span class="live"><span class="dot running"></span>Üretiliyor</span>` : ''}</div>
        <b>${esc(j.title)}</b>
        <small><span class="dot ${j.status}"></span>${j.example ? 'Örnek' : STATUS[j.status] || ''} · ${s.aspect || ''} · ${lenText(s.seconds || 0)}${j.example ? '' : ` · ${ago(j.created)}`}</small>
      </button>`;
    }).join('')}</div>`
    : `<div class="empty">${icon('film')}<h2>Henüz bir şey üretilmedi</h2><p>Bir fikir yaz, birkaç soruyu cevapla; film burada belirir.</p><button class="btn lg primary" id="newP2">Yeni proje</button></div>`}
  </div>`;
  $$('.card').forEach(c => c.onclick = () => openJob(c.dataset.id));
  $('#newP').onclick = renderNew; if ($('#newP2')) $('#newP2').onclick = renderNew;

// ---------- new project: brief, questions, script, production ----------
const FLOW = [['new', 'Brief'], ['questions', 'Sorular'], ['plan', 'Senaryo'], ['go', 'Üretim']];
function flowBar(at) {
  const i = FLOW.findIndex(([k]) => k === at);
  return `<ol class="flow">${FLOW.map(([k, l], n) => `<li class="${n < i ? 'done' : n === i ? 'now' : ''}"><button ${n < i && k !== 'go' ? `data-flow="${k}"` : 'disabled'}><span>${n < i ? icon('check') : n + 1}</span>${l}</button></li>`).join('')}</ol>`;
}
function bindFlow() {
  $$('[data-flow]').forEach(b => b.onclick = () => ({ new: renderNew, questions: () => S.q ? (go('questions'), renderQuestions()) : askQuestions(), plan: () => S.plan ? (go('plan'), renderPlan()) : writePlan() })[b.dataset.flow]());
}
const ASPECTS = [['16:9', 'YouTube, sunum'], ['9:16', 'Reels, TikTok, Shorts'], ['1:1', 'Kare akış'], ['4:5', 'Instagram akış']];

const MUSICS = [['open', 'Hazır kayıt', 'Açık lisanslı müzik'], ['code', 'Kodla beste', 'Filme özel yazılır'], ['own', 'Kendi dosyam', 'Kurgu müziğe oturur'], ['none', 'Müziksiz', 'Yalnız efekt ve anlatım']];
const PURPOSES = [['cinematic', 'Sinematik', 'Hikâye, his, atmosfer'], ['ad', 'Reklam', 'Ürün, mesaj, çağrı'], ['app', 'Uygulama tanıtımı', 'Kendi uygulamanın promosu']];
const WPS = () => S.settings.lang === 'en' ? 2.5 : 2.2;
// Evenly spaced stops; linear inside each gap, so halfway between "30 sn" and "1 dk" is 45 sn.
const STOPS = [[5, '5 sn'], [15, '15 sn'], [30, '30 sn'], [60, '1 dk'], [180, '3 dk'], [300, '5 dk'], [600, '10 dk'], [1800, '30 dk']];
const SEG = 1000 / (STOPS.length - 1);
function secToSlider(sec) {
  sec = Math.max(5, Math.min(1800, sec));
  for (let i = 1; i < STOPS.length; i++) { const [a] = STOPS[i - 1], [b] = STOPS[i]; if (sec <= b) return Math.round((i - 1 + (sec - a) / (b - a)) * SEG); }
  return 1000;
}
function sliderToSec(v) { const i = Math.min(STOPS.length - 2, Math.floor(v / SEG)), f = v / SEG - i, raw = STOPS[i][0] + f * (STOPS[i + 1][0] - STOPS[i][0]); const step = raw < 120 ? 1 : raw < 600 ? 5 : 15; return Math.max(5, Math.min(1800, Math.round(raw / step) * step)); }
const tcode = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
function tile(key, v, title, sub, extra = '') {
  const on = String(S.settings[key]) === String(v);
  return `<button class="tile ${on ? 'on' : ''}" role="radio" aria-checked="${on}" data-set="${key}" data-v="${v}">${extra}<b>${title}</b><small>${sub}</small></button>`;
}
function frame(r) { const [w, h] = RATIO[r]; const k = 34 / Math.max(w, h); return `<span class="frame"><i style="width:${Math.round(w * k)}px;height:${Math.round(h * k)}px"></i></span>`; }
function lenHint() {
  const s = S.settings, w = Math.round(s.seconds * (s.lang === 'en' ? 2.5 : 2.2));
  return `${s.mode === 'film' ? 'Film modu' : 'Hızlı mod'}${s.voice !== 'none' ? `, anlatım en fazla ${w} kelime` : ''}`;
}

function renderNew() {
  if (S.view !== 'new') go('new');
  setChrome('');
  const s = S.settings, k = S.status?.keys || {}, own = s.scriptMode === 'own', clone = s.scriptMode === 'clone';

          <button class="btn sm" id="fitDur" ${!words(S.script) ? 'disabled' : ''}>Süreyi metne ayarla</button>

      : `<textarea id="idea" aria-label="Fikir" placeholder="Ne anlatmak istiyorsun? Bir hikâye, bir ürün, bir yer, bir his…">${esc(S.idea)}</textarea>`}
      ${clone ? '' : `<div id="durHint" class="dur-hint" hidden></div><div class="attach">

function sizeText() { const s = S.settings, m = { '16:9': [16, 9], '9:16': [9, 16], '1:1': [1, 1], '4:5': [4, 5] }[s.aspect], long = s.res === 2160 ? 3840 : s.res === 1080 ? 1920 : 1280, short = s.res === 2160 ? 2160 : s.res;

// "3 saatlik bir film", "5 dakikalık", "90 saniye" -> seconds the user wrote into the idea

const PHASES = {

  film: [['Görüşme', /^1\b|interview/i], ['Yol haritası', /^2\b|roadmap/i], ['Senaryo', /^3\b|script/i], ['Stil karesi', /^4\b|style/i], ['Animatik', /^5\b|animatic/i], ['Taslak', /^6\b|draft/i], ['Final', /^7\b|final/i]],
};
function renderInspector() {
  const el = $('#inspector'); if (!el || !S.job) return;
  const j = S.job, s = j.settings || {}, st = S.out.state || {}, vids = S.out.videos || [];
  const steps = PHASES[s.mode === 'film' ? 'film' : 'quick'];
  let idx = st.phase ? steps.findIndex(([, re]) => re.test(st.phase)) : (j.status === 'running' ? 0 : -1);
  if (vids.some(v => v.kind === 'final') || (/deliver/i.test(st.phase || '') && idx === steps.length - 1)) idx = steps.length;
  // Not running and a video is out: the reached step is finished, nothing pulses.
  if (j.status !== 'running' && vids.length && idx >= 0 && idx < steps.length) idx += 1;
  const cur = currentVideo();
  el.innerHTML = `
    ${j.kind === 'clone' ? `<div class="section-title">Klon</div><div class="group"><div class="kv"><span>Kaynak</span><b>${esc(base(j.refVideo))}</b><span>Araç</span><b>HyperFrames</b></div></div>` : `<div class="section-title">Aşama</div>
    <div class="group"><div class="steps">${steps.map(([l], i) => `<div class="step ${i < idx ? 'done' : i === idx && j.status === 'running' ? 'now' : ''}"><span class="mk">${i < idx ? icon('check') : ''}</span>${l}</div>`).join('')}</div>
</div>`}
    <div class="section-title">Bilgi</div>
    <div class="group"><div class="kv">
      <span>Geçen süre</span><b id="elapsed">${elapsed()}</b>
      <span>Tahmini</span><b>${j.estimate ? fmtMin(j.estimate.minutes) : ''}</b>
      ${j.kind === 'clone' ? '<span>Biçim</span><b>Orijinalden</b>' : `<span>Biçim</span><b>${s.aspect || ''}, ${s.res === 2160 ? '4K' : (s.res || '') + 'p'}, ${s.fps || ''} fps</b>
      <span>Uzunluk</span><b>${lenText(s.seconds || 0)}, ${s.mode === 'film' ? 'Film' : 'Hızlı'}</b>`}
    </div>${j.status === 'running' ? `<div class="bar"><i id="estBar" style="width:${progress()}%"></i></div><div class="info-act"><button class="btn" id="stop">${icon('x')}Üretimi durdur</button></div>` : (j.status === 'stopped' || j.status === 'error') && !j.example ? `<div class="info-act"><button class="btn primary" id="resume">${icon('play')}Kaldığı yerden devam</button>${j.kind === 'clone' ? '' : '<button class="btn" id="redo" title="Fikir ve ayarlar yeni projeye kopyalanır; süre, mod ve biçimi değiştirip yeniden başlatırsın">Ayarları değiştirip yeniden başlat</button>'}</div>` : ''}</div>
    ${vids.length ? (() => {
      const main = vids.filter(v => !isRender(v)), mids = vids.filter(isRender);
      const row = (v, kind) => `<button class="item ${v === cur ? 'on' : ''}" data-v="${esc(v.path)}"><span class="badge ${kind}">${KIND[kind] || ''}</span><span class="lbl vname">${esc(v.name)}</span></button>`;
      return `<div class="section-title">Videolar</div>
      ${main.length ? `<div class="group vlist">${main.map(v => row(v, v.kind)).join('')}</div>` : ''}
      ${mids.length ? `<div class="group vlist ${main.length ? 'mt' : ''}"><button class="item mids" id="midsToggle"><span class="lbl vname">Ara render'lar</span><span class="mids-n">${mids.length}</span>${icon(S.showMids ? 'x' : 'plus')}</button>${S.showMids || !main.length ? mids.map(v => row(v, 'render')).join('') : ''}</div>` : ''}`;
    })() : ''}
    ${S.out.stills?.length ? `<div class="section-title">Kareler</div><div class="stills">${S.out.stills.slice(0, 12).map(x => `<img src="${fileUrl(x.path)}" data-zoom loading="lazy" alt="">`).join('')}</div>` : ''}`;
  $$('#inspector [data-v]').forEach(b => b.onclick = () => { S.pick = b.dataset.v; renderPlayer(); renderInspector(); if (S.dockMode === 'edit') renderDock(); });
  $$('#inspector [data-zoom]').forEach(zoomable);
  if ($('#midsToggle')) $('#midsToggle').onclick = () => { S.showMids = !S.showMids; renderInspector(); };
  if ($('#stop')) $('#stop').onclick = () => api(`/api/jobs/${j.id}/stop`, {});
  if ($('#resume')) $('#resume').onclick = () => post('reply', { kind: 'resume' });
  if ($('#redo')) $('#redo').onclick = () => {
    S.settings = { ...defaults, ...(j.settings || {}) };
    S.idea = j.idea || ''; S.script = j.script || ''; S.notes = j.notes || '';
    S.refVideo = j.refVideo ? { path: j.refVideo } : null; S.refFolder = j.refFolder ? { path: j.refFolder, count: 0 } : null;
    S.musicFile = j.musicFile ? { path: j.musicFile } : null; S.refImages = (j.refImages || []).map(path => ({ path })); S.appVideos = (j.appVideos || []).map(path => ({ path }));
    S.q = null; S.plan = null; S.answers = {}; saveDraft(); saveFlow();
    renderNew(); updateEstimate(); setTimeout(() => { $('.len')?.scrollIntoView({ block: 'center' }); $('#lenOut')?.focus(); }, 60);
    toast('Fikir ve ayarlar kopyalandı; süreyi değiştirip yeniden başlat');
  };
}
const OPS = [['captions', 'Altyazı'], ['title', 'Başlık kartı'], ['lower', 'Alt bant'], ['logo', 'Logo'], ['endcard', 'Bitiş kartı'], ['transitions', 'Geçişler'], ['music', 'Müzik'], ['sfx', 'Ses efekti'], ['look', 'Renk'], ['reframe', 'Dikey sürüm']];
function renderDock() {
  const f = $('#foot'); if (!f || S.view !== 'job') return;
  if (S.job.example) {
    f.innerHTML = `<div class="foot-in full"><div class="example-bar"><span>${icon('film')}</span><p>Örnek proje: cinecode bu 15 saniyelik filmi soru sormadan, 17 dakikada üretti. Kopyalarsan senin projen olur; not yazıp revize edebilir, HyperFrames ile düzenleyebilirsin.</p><button class="btn" id="exNew">Yeni proje</button><button class="btn primary" id="exFork">${icon('copy')}Kopyala ve revize et</button></div></div>`;
    $('#exNew').onclick = () => go('new');
    $('#exFork').onclick = async () => { try { const c = await api(`/api/jobs/${S.job.id}/fork`, {}); await loadJobs(); openJob(c.id); } catch (e) { toast(e.message); } };
    return;
  }
  const j = S.job, running = j.status === 'running', vids = S.out.videos || [], cur = currentVideo(), hf = S.status?.hyperframes;
  const canFinal = !running && j.settings?.deliver !== 'final' && vids.length && !vids.some(v => v.kind === 'final');
  if (!vids.length && S.dockMode === 'edit') S.dockMode = 'revise';
  const edit = S.dockMode === 'edit';
  const hint = running ? (j.turnKind === 'edit' ? 'HyperFrames düzenliyor' : 'cinecode üretiyor') : edit ? (hf ? `Düzenlenecek video: ${cur?.name || ''}` : 'HyperFrames kurulu değil (Ayarlar › Araçlar)') : vids.length ? 'Revize: notunla film yeniden kurulur. Düzenle: bitmiş videoya katman eklenir.' : 'Soru gelirse cevabını, yön değiştirmek istersen notunu yaz';
  f.innerHTML = `<div class="foot-in full"><div class="dock">
    <div class="dock-top">
      ${vids.length ? `<div class="seg" role="tablist"><button role="tab" aria-selected="${!edit}" class="${!edit ? 'on' : ''}" data-mode="revise" title="Filmi cinecode yeniden kurar: hikâye, sahne, ses, süre">Revize</button><button role="tab" aria-selected="${edit}" class="${edit ? 'on' : ''}" data-mode="edit" title="Bitmiş videonun üstüne HyperFrames ile altyazı, başlık, müzik, logo ekler">Düzenle</button></div>` : ''}
      <span class="meta">${esc(hint)}</span>
    </div>
    ${edit && !running ? `<div class="ops">${OPS.map(([k, l]) => `<button class="chip ${S.ops.includes(k) ? 'on' : ''}" data-op="${k}" aria-pressed="${S.ops.includes(k)}">${l}</button>`).join('')}</div>` : ''}
    <div class="dock-row"><textarea id="reply" rows="1" ${running ? 'disabled' : ''} aria-label="Not" placeholder="${running ? 'Üretim bitince not yazabilirsin' : edit ? 'Ne değişsin? Örnek: başlık beyaz ve büyük olsun, altyazı alt kenara' : 'Revize notu ya da sorulana cevabın'}"></textarea>
      ${canFinal && !edit ? `<button class="btn lg" id="final" title="Taslağı onayla, tam boy finali çıkar">Finali çıkar</button>` : ''}
      <button class="btn lg primary" id="send" ${running ? 'disabled' : ''}>${edit ? 'Düzenle' : 'Gönder'}</button></div>
  </div></div>`;
  $$('[data-mode]').forEach(b => b.onclick = () => { if (b.disabled) return; S.dockMode = b.dataset.mode; renderDock(); });
  $$('[data-op]').forEach(b => b.onclick = () => { const k = b.dataset.op; S.ops = S.ops.includes(k) ? S.ops.filter(x => x !== k) : [...S.ops, k]; b.classList.toggle('on'); b.setAttribute('aria-pressed', S.ops.includes(k)); });
  const ta = $('#reply');
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; };
  ta.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('#send')?.click(); };
  // One click, one request: buttons stay locked until the server answers, so a note never goes twice.
  const once = async (btn, fn) => { if (btn.disabled) return; btn.disabled = true; const ok = await fn(); if (!ok && document.body.contains(btn)) btn.disabled = false; };
  if ($('#final')) $('#final').onclick = () => once($('#final'), () => post('reply', { kind: 'final' }));
  $('#send').onclick = () => once($('#send'), async () => {
    if (running) return false;
    const text = ta.value.trim();
    if (edit) {
      if (!text && !S.ops.length) { ta.focus(); return false; }
      let logo = null;
      if (S.ops.includes('logo')) { const r = await pickPath('image'); if (!r) { toast('Logo dosyası seçilmedi'); return false; } logo = r.path; }
      if (await post('edit', { text, ops: S.ops, source: cur?.path, logo })) { S.ops = []; return true; }
      return false;
    }
    if (!text) { ta.focus(); return false; }
    if (await post('reply', { text })) { ta.value = ''; return true; }
    return false;
  });
}
async function post(act, body) { try { await api(`/api/jobs/${S.job.id}/${act}`, body); return true; } catch (e) { toast(e.message); return false; } }

let logQueued = false;
function queueLog() { if (!logQueued) { logQueued = true; setTimeout(() => { logQueued = false; renderLog(); }, 30); } }
function md(t) {
  let html = '', list = false;
  for (let l of esc(t).split('\n')) {
    l = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
    const li = l.match(/^\s*[-*•]\s+(.*)/) || l.match(/^\s*\d+[.)]\s+(.*)/);
    if (li) { if (!list) { html += '<ul>'; list = true; } html += `<li>${li[1]}</li>`; continue; }
    if (list) { html += '</ul>'; list = false; }
    if (l.trim()) html += `<p>${l.replace(/^#+\s*/, '')}</p>`;
  }
  if (list) html += '</ul>';
  const media = [...new Set(t.match(/(?:\/(?:Users|home|private|tmp)\/|[A-Z]:\\)[^\n`"'<>|*]+?\.(?:png|jpe?g|webp|mp4|mov)\b/gi) || [])].slice(0, 4);
  for (const p of media) html += /\.(mp4|mov)$/i.test(p) ? `<video src="${fileUrl(p)}" controls preload="metadata"></video>` : `<img src="${fileUrl(p)}" data-zoom loading="lazy" alt="">`;
  return html;
}
function cleanTool(t) {
  let x = t.replace(/^cd\s+("[^"]*"|\S+)\s*&&\s*/, '');
  const root = S.status?.filmsRoot; if (root) x = x.split(root + '/').join('').split(root).join('');
  x = x.replace(/\/Users\/[^/\s"]+|[A-Z]:\\Users\\[^\\\s"]+/g, '~').replace(/~[\\/]\.claude[\\/]skills[\\/]cinecode[\\/]/g, '');
  return /^(python3?|py|node|npx|ffmpeg|ffprobe|sed|grep|cat|ls|wc|head|tail|git)\b/.test(x) ? 'Komut: ' + x : x;
}
function renderLog() {
  const log = $('#log'), stage = $('#stage'); if (!log || !stage) return;
  const near = stage.scrollHeight - stage.scrollTop - stage.clientHeight < 160;
  let html = '<h4>Etkinlik</h4>', tools = [];
  const flush = () => { if (tools.length) { html += `<div class="tools ${tools.length > 4 ? 'more' : ''}">${tools.length > 4 ? `<button class="toggle">${tools.length - 4} adım daha göster</button>` : ''}${tools.map(t => `<div class="tool"><span>${esc(cleanTool(t))}</span></div>`).join('')}</div>`; tools = []; } };
  const texts = S.events.filter(e => e.kind === 'text');
  for (const ev of S.events) {
    if (ev.kind === 'tool') { tools.push(ev.text); continue; }
    flush();
    if (ev.kind === 'user') html += `<div class="msg user">${md(ev.text)}</div>`;
    else if (ev.kind === 'error') html += `<div class="msg err">${esc(ev.text)}</div>`;
    else if (ev.kind === 'result') { if (!texts.some(x => x.text.trim() === ev.text.trim())) html += `<div class="msg">${md(ev.text)}</div>`; }
    else html += `<div class="msg">${md(ev.text)}</div>`;
  }
  flush();
  if (S.job.status === 'running') html += `<div class="working"><span class="spin"></span>Çalışıyor</div>`;
  else if (S.job.note) html += `<div class="working">${esc(S.job.note)}</div>`;
  log.innerHTML = html;
  $$('#log .toggle').forEach(b => b.onclick = () => { b.parentElement.classList.remove('more'); b.remove(); });
  $$('#log [data-zoom]').forEach(zoomable);
  if (near) stage.scrollTop = stage.scrollHeight;
}
function zoomable(img) { img.onclick = () => { const d = document.createElement('div'); d.className = 'lightbox'; d.innerHTML = `<img src="${img.src}" alt="">`; d.onclick = () => d.remove(); document.body.append(d); }; }

// ---------- boot ----------
$('#navNew').onclick = renderNew;
$('#navLib').onclick = () => { go('library'); renderLibrary(); };
$('#navSettings').onclick = () => { go('settings'); renderSettings(); refreshStatus(); };
(async () => {
  await Promise.all([loadJobs(), refreshStatus()]);
  let back = null; try { back = JSON.parse(sessionStorage.getItem('cs.view')); sessionStorage.removeItem('cs.view'); const f = JSON.parse(sessionStorage.getItem('cs.flow')); if (f) Object.assign(S, { q: f.q, answers: f.answers || {}, own: f.own || {}, plan: f.plan }); } catch {}
  if (back) {
    if (back.view === 'job' && S.jobs.some(j => j.id === back.id)) openJob(back.id);
    else if (back.view === 'plan' && S.plan) { go('plan'); renderPlan(); }
    else if (back.view === 'questions' && S.q) { go('questions'); renderQuestions(); }
    else if (back.view === 'library') { go('library'); renderLibrary(); }
    else if (back.view === 'settings') { go('settings'); renderSettings(); }
    else renderNew();
    if (back.y) requestAnimationFrame(() => { $('#body').scrollTop = back.y; });
    return;
  }
  const live = S.jobs.find(j => j.status === 'running');
  if (live) openJob(live.id); else if (S.jobs.length) { go('library'); renderLibrary(); } else renderNew();
})();
// Live reload: when index.html changes on disk the panel reloads in place, keeping the view.
(() => { let first = null; const ev = new EventSource('/api/live'); ev.onmessage = e => {
  if (first === null) { first = e.data; return; }
  if (e.data !== first) { try { sessionStorage.setItem('cs.view', JSON.stringify({ view: S.view, id: S.job?.id, y: $('#body').scrollTop })); } catch {} location.reload(); }
}; })();
setInterval(loadJobs, 30000);
</script>
